services:

  postgres:
    image: postgres:15
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_central
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - erp_network

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: erp_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: erp_user
      RABBITMQ_DEFAULT_PASS: erp_password
    ports:
      - "5672:5672"
      - "15672:15672"   # panel web en http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - erp_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      # Mismo motivo que en "worker": el .env trae "localhost" pensado para
      # cuando corres uvicorn directo en el host; este contenedor necesita
      # los nombres de servicio de la red de docker-compose.
      DATABASE_URL: postgresql+asyncpg://erp_user:erp_password@postgres:5432/erp_central
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://erp_user:erp_password@rabbitmq:5672/
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app   # hot reload en desarrollo
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - erp_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: erp_worker
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      # El .env trae "localhost" porque el backend normalmente corre con
      # uvicorn directo en el host (conectando a estos servicios por sus
      # puertos publicados). Este contenedor SI vive dentro de la red de
      # docker-compose, asi que debe hablarles por su nombre de servicio.
      DATABASE_URL: postgresql+asyncpg://erp_user:erp_password@postgres:5432/erp_central
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://erp_user:erp_password@rabbitmq:5672/
    volumes:
      - ../backend:/app
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - erp_network
    # -B embebe Celery beat (el programador de tareas periodicas) en el mismo
    # proceso del worker -- valido porque solo hay una replica de "worker";
    # con mas de una replica, beat duplicado dispara la tarea periodica mas
    # de una vez y haria falta un servicio de beat aparte.
    command: celery -A workers.celery_app worker --loglevel=info -B

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  erp_network:
    driver: bridge
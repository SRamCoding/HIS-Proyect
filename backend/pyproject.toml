[project]
name = "erp-hospitalario"
version = "0.1.0"
description = "ERP Hospitalario - Backend FastAPI"
requires-python = ">=3.11"

dependencies = [
    # --- core ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # --- base de datos ---
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # --- auth ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # --- caché ---
    "redis>=5.0.4",

    # --- tareas async ---
    "celery>=5.4.0",
    "kombu>=5.3.0",

    # --- utilidades ---
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "pillow>=10.3.0",

    # --- PDFs ---
    "reportlab>=4.2.0",

    # --- salud / interoperabilidad ---
    "fhir.resources>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"